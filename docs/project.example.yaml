  - image: data/board/board1.png
    width_m: 0.5
    height_m: 0.5
  skyboxes:
  - data/skybox/room.jpg
  environment_strength: 1.0
  camera:
    distance_m:
    - 0.8
    - 1.2
    elevation_deg:
    - 25.0
    - 45.0
    azimuth_deg:
    - 160.0
    - 340.0
    fov_deg: 45.0
    jitter_xy_m: 0.03
    jitter_roll_deg: 4.0
