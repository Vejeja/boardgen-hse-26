[project]
name = "boardgen"
version = "0.3.0"
description = "Local application for tabletop video reconstruction, YOLO dataset generation and detector training."
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0.0",
    "Pillow>=10.4.0",
    "PyYAML>=6.0.2",
    "scikit-image>=0.24.0",
    "trimesh>=4.4.0",
    "scipy>=1.14.0",
    "OpenEXR==3.5.2",
    "pydantic==2.13.5",
]

[project.scripts]
boardgen = "boardgen.cli:main"
boardgen-project = "boardgen.studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[project.optional-dependencies]
research = [
    "pymeshlab==2025.7.post1",
    "mapbox-earcut==2.1.0",
    "networkx>=3.0",
    "mlx==0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-metal==0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
neural = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.44.0",
    "huggingface-hub>=0.24.0",
    "safetensors>=0.4.0",
    "einops>=0.8.0",
    "kornia>=0.7.0",
    "timm>=1.0.0",
]
studio = [
    "ultralytics==8.4.174",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/boardgen"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast CPU-only tests",
    "integration: multi-component tests that may touch larger artifacts",
    "gpu: tests requiring CUDA/MPS or other GPU support",
    "blender: tests requiring Blender",
    "research: experimental benchmarks not required for the base suite",
]
