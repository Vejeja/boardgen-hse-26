[project]
name = "boardgen"
version = "0.3.0"
description = "Tools for tabletop video processing."
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0.0",
    "Pillow>=10.4.0",
]

[project.scripts]
boardgen = "boardgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]


[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/boardgen"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: multi-component tests that may touch larger artifacts",
]
